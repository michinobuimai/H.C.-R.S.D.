<!DOCTYPE html>
<html>
<head>
    <title>(HC)RSD algorithm (Hilbert Constrained Recursive Spacial Divison)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>(HC)RSD algorithm </h1>

    <div id="ui">

    <div class="sliderRow">
        <label for="nSlider">n:</label>
        <input id="nSlider" type="range" min="1" max="6" value="6">
        <span id="nValue">6</span>
    </div>

    <div class="sliderRow">
        <label for="speedSlider">Speed:</label>
        <input id="speedSlider" type="range" min="50" max="1000" value="300">
    </div>

    <div id="controls">
        <button id="playBtn">▶</button>
        <button id="stepBtn"><span>⏭</span></button>
        <button id="resetBtn"><span>↩</span></button>
    </div>

    </div>
    <canvas id="canvas"></canvas>

    <script type="module" src="main.js"></script>

    
</body>
</html>
